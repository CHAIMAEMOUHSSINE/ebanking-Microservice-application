spring.application.name=ebank-bot
server.port=8058

# Google Gemini
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.model=gemini-3.8-flash
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# Discovery and Config
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
eureka.client.enabled=false
eureka.client.jersey.enabled=false
# MCP Servers
spring.ai.mcp.client.stremable-http.connection.customers.url=http://localhost:8056/mcp
spring.ai.mcp.client.stremable-http.connection.ebank.url=http://localhost:8057/mcp

telegram.token=${TELEGRAM_TOKEN}
discord.token=${DISCORD_TOKEN}
